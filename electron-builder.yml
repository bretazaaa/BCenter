appId: com.bcenter.app
# ssh2 works without its optional native addons: skip native rebuilds (no build tools needed).
npmRebuild: false
productName: BCenter
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: src/main/tray.ico
    to: tray.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BCenter
  uninstallDisplayName: BCenter
  deleteAppDataOnUninstall: false
  artifactName: BCenter-Setup-${version}.${ext}
# Updates are published as GitHub Releases (installer + latest.yml). CI uploads into a draft
# release and publishes it once complete (see .github/workflows/release.yml).
publish:
  provider: github
  owner: bretazaaa
  repo: BCenter
  releaseType: draft
