# BCenter Server (prototype). Interface : http://<serveur>:8080
# Premier lancement : récupérez le code d'installation avec « docker logs bcenter ».
services:
  bcenter:
    build: .
    container_name: bcenter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Clés SSH (facultatif, lecture seule) : chemin à indiquer dans BCenter, par ex. /keys/id_ed25519
      # - ~/.ssh:/keys:ro
    environment:
      TZ: Europe/Paris
      # Derrière un reverse proxy HTTPS (Traefik, Caddy, Nginx Proxy Manager…) :
      # BCENTER_TRUST_PROXY: "1"
      # Ou HTTPS directement :
      # BCENTER_TLS_CERT: /data/cert.pem
      # BCENTER_TLS_KEY: /data/key.pem
