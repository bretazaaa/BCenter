# Publishes a new BCenter version to the public distribution repository (bretazaaa/BCenter).
# Push a tag "vX.Y.Z" matching the version in package.json: the workflow runs the checks,
# builds the Windows installer, uploads it to a draft release in the public repository and
# publishes it once complete. Installed copies of BCenter then update automatically.
#
# Requires the RELEASE_TOKEN secret: a fine-grained token with "Contents: read and write"
# on bretazaaa/BCenter.
name: Release

on:
  push:
    tags: ['v*']

env:
  PUBLIC_REPO: bretazaaa/BCenter

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check that the release token is configured
        shell: pwsh
        run: if (-not $env:GH_TOKEN) { throw "The RELEASE_TOKEN secret is missing (Settings > Secrets and variables > Actions)." }
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # A single draft release is created up front: electron-builder uploads its assets in parallel
      # and would otherwise create one release per asset.
      - name: Create a draft release
        shell: pwsh
        # Release notes: release-notes/vX.Y.Z.md when present.
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) { Set-Content $notes "BCenter ${{ github.ref_name }}" -Encoding utf8 }
          gh release view "${{ github.ref_name }}" --repo $env:PUBLIC_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo $env:PUBLIC_REPO --draft --target main --title "BCenter ${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release edit "${{ github.ref_name }}" --repo $env:PUBLIC_REPO --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Build the installer and upload it to the draft
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Publish the release
        run: gh release edit "${{ github.ref_name }}" --repo ${{ env.PUBLIC_REPO }} --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
