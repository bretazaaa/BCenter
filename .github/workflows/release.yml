# Publishes a new BCenter version.
# Push a tag "vX.Y.Z" matching the version in package.json: the workflow runs the checks,
# builds the Windows installer and publishes it as a GitHub Release, where installed
# copies of BCenter pick it up automatically (electron-updater).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # A single draft release is created up front: electron-builder uploads its assets in parallel
      # and would otherwise create one release per asset. The release is published once complete,
      # so installed copies never see a partial release.
      - name: Create a draft release
        run: gh release create "${{ github.ref_name }}" --draft --title "BCenter ${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and upload it to the draft
        run: npx electron-builder --win --x64 --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
